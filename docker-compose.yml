services:
  call-intelligence-pipeline:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    image: call-intelligence-pipeline:experiment
    container_name: call-intelligence-pipeline
    restart: unless-stopped
    labels:
      - "traefik.enable=false"
    network_mode: host
    environment:
      PORT: "${PORT:-3433}"
      MODEL_PROVIDER: "${MODEL_PROVIDER:-whisper-bn}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-https://api.openai.com/v1}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-4o-mini}"
      WHISPER_MODEL: "${WHISPER_MODEL:-bitwisemind/sam_15000_clean_text_full_model}"
      HF_HOME: "${HF_HOME:-/models}"
      TRANSFORMERS_CACHE: "${TRANSFORMERS_CACHE:-/models}"
      CUDA_VISIBLE_DEVICES: "${CUDA_VISIBLE_DEVICES:-0}"
      ASR_BATCH_SIZE: "${ASR_BATCH_SIZE:-1}"
      WEB_CONCURRENCY: "${WEB_CONCURRENCY:-2}"
      WEB_THREADS: "${WEB_THREADS:-4}"
      WEB_TIMEOUT: "${WEB_TIMEOUT:-300}"
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
      PYANNOTE_MODEL_DIR: "/models/pyannote/community-1"
      PYANNOTE_SEGMENTATION_CHECKPOINT: "/models/pyannote/bangla-segmentation/segmentation-epoch=39.ckpt"
      DIARIZATION_DEVICE: "cuda:0"
    volumes:
      - ./samples:/app/samples:ro
      - ./transcripts:/app/transcripts
      - call-intelligence-models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c 'import os, urllib.request; urllib.request.urlopen("http://127.0.0.1:%s/health" % os.environ.get("PORT", "3433"), timeout=3).read(1)'
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  call-intelligence-pipeline-gpu1:
    profiles: ["gpu1"]
    extends:
      service: call-intelligence-pipeline
    container_name: call-intelligence-pipeline-gpu1
    environment:
      PORT: "${PORT_GPU1:-3434}"
      MODEL_PROVIDER: "${MODEL_PROVIDER_GPU1:-whisper-bn}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-https://api.openai.com/v1}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-4o-mini}"
      WHISPER_MODEL: "${WHISPER_MODEL:-bitwisemind/sam_15000_clean_text_full_model}"
      HF_HOME: "${HF_HOME:-/models}"
      TRANSFORMERS_CACHE: "${TRANSFORMERS_CACHE:-/models}"
      CUDA_VISIBLE_DEVICES: "${CUDA_VISIBLE_DEVICES_GPU1:-1}"
      ASR_BATCH_SIZE: "${ASR_BATCH_SIZE:-1}"
      WEB_CONCURRENCY: "${WEB_CONCURRENCY_GPU1:-1}"
      WEB_THREADS: "${WEB_THREADS_GPU1:-2}"
      WEB_TIMEOUT: "${WEB_TIMEOUT:-300}"
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
      PYANNOTE_MODEL_DIR: "/models/pyannote/community-1"
      PYANNOTE_SEGMENTATION_CHECKPOINT: "/models/pyannote/bangla-segmentation/segmentation-epoch=39.ckpt"
      DIARIZATION_DEVICE: "cuda:0"

volumes:
  call-intelligence-models: