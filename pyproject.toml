[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "call-intelligence-pipeline"
version = "1.0.0"
description = "Transcribe call recordings and analyze quality — speaker separation, sentiment, FCR, agent scoring, and coaching tips."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "call-intelligence-pipeline contributors" }]
keywords = ["call-center", "speech-to-text", "asr", "call-quality", "qa", "transcription", "sentiment", "openai-compatible", "bengali"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = []

[project.optional-dependencies]
# Legacy Google Gemini ASR backend for backwards-compatible local CLI/demo paths.
gemini = ["google-genai>=1.0.0"]
# Local Bengali Whisper SAM15K ASR backend. Torch is installed from the CUDA
# wheel index in Docker for production GPU support.
diarization = ["pyannote.audio>=3.3" ]

sam15000 = [
    "transformers>=4.46.0",
    "accelerate>=0.34.0",
    "librosa>=0.10.0",
    "soundfile>=0.12.0",
]
# Reporting helpers (CSV/Excel export).
reports = ["pandas", "openpyxl", "jinja2"]
dev = ["pytest", "ruff", "httpx2"]

api = ["fastapi>=0.115.0", "uvicorn[standard]>=0.30.0", "python-multipart>=0.0.9"]

[project.scripts]
transcribe = "transcribe.cli:main"
transcribe-analyze = "transcribe.analyze_cli:main"

[project.urls]
Homepage = "https://github.com/md-riaz/call-intelligence-pipeline"
Issues = "https://github.com/md-riaz/call-intelligence-pipeline/issues"

[tool.setuptools.packages.find]
include = ["transcribe", "transcribe.*"]
